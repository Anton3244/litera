<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12101a">
<title>Літера — підготовка до НМТ з української літератури</title>
<meta name="description" content="Теорія по темах, тести у форматі НМТ, вогник за щоденні заняття.">
<meta property="og:title" content="Літера — українська література до НМТ">
<meta property="og:description" content="Теорія, тести у форматі НМТ і вогник за щоденні заняття.">
<meta property="og:image" content="assets/art/og-image.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot__mark">Л</div>
  <div class="boot__text">Готуємо матеріали…</div>
</div>

<header id="topbar" class="topbar" hidden>
  <button class="topbar__back" data-nav-back aria-label="Назад" hidden>‹</button>
  <div class="topbar__stats">
    <span class="stat stat--streak" title="Днів поспіль"><span class="stat__icon">🔥</span><span id="stat-streak">0</span></span>
    <span class="stat stat--xp" title="Досвід"><span class="stat__icon">⭐</span><span id="stat-xp">0</span></span>
    <span class="stat stat--hearts" title="Життя на сьогодні"><span class="stat__icon">💛</span><span id="stat-hearts">5</span></span>
  </div>
  <button class="topbar__settings" data-nav="settings" aria-label="Налаштування">⚙</button>
</header>

<main id="view" class="view" hidden></main>

<nav id="tabbar" class="tabbar" hidden>
  <button class="tab" data-nav="home"><span class="tab__icon">🏠</span><span>Навчання</span></button>
  <button class="tab" data-nav="practice"><span class="tab__icon">🎯</span><span>Тренування</span></button>
  <button class="tab" data-nav="stats"><span class="tab__icon">📊</span><span>Прогрес</span></button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
